version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: pm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Deep@123
      MYSQL_DATABASE: predictive_maintenance
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange_me"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pm_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Deep@123
      DB_NAME: predictive_maintenance
      MOTOR_ID: MOTOR-001
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DEVICE_API_KEY: ""
      DEMO_MODE_DEFAULT: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws/live
    container_name: pm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data: